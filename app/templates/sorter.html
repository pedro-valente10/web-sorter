{% extends "base.html" %}
{% block title %}Web Sorter{% endblock %}
{% block content %}
<header class="topbar">
  <h1>Web Sorter</h1>
  <div class="who">
    <span>{{ username }}</span>
    <form method="post" action="{{ url_for('auth.logout') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <button type="submit">Sair</button>
    </form>
  </div>
</header>

<main class="workspace">
  <section class="toolbar">
    <button id="pick-folder" class="primary" type="button">
      Escolher pasta
    </button>
    <span id="status" class="muted" role="status">
      Escolha uma pasta para começar.
    </span>
  </section>

  <section id="recent" class="panel" hidden>
    <h2>Pastas anteriores</h2>
    <p class="muted">Escolha a mesma pasta de novo para continuar.</p>
    <ul id="recent-list"></ul>
  </section>

  <section id="session-panel" class="panel" hidden>
    <div class="row">
      <form id="destination-form" class="inline">
        <input id="destination-name" placeholder="Novo destino (subpasta)"
               maxlength="60" required>
        <button type="submit">Adicionar destino</button>
      </form>
      <label class="inline">Mostrar
        <select id="filter">
          <option value="pending">Sem decisão</option>
          <option value="all">Todos</option>
          <option value="move">Mover</option>
          <option value="delete">Excluir</option>
          <option value="keep">Manter</option>
        </select>
      </label>
      <button id="apply" type="button" class="danger">
        Aplicar decisões na pasta
      </button>
    </div>
    <p id="progress" class="muted"></p>
  </section>

  <section id="grid" class="grid" aria-live="polite"></section>
</main>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/sorter.js') }}" defer></script>
{% endblock %}
